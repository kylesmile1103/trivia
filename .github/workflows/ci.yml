# The pull request gate (docs/ci.md). `ci-ok` is the one check branch protection requires.
name: CI

on:
  pull_request:
  push:
    # Not every branch: a pull request's own run is the one that counts (docs/ci.md,
    # "Triggers"). ci/** branches test changes to CI before they have a pull request.
    branches: [main, 'ci/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  FORCE_COLOR: '1'

jobs:
  gate:
    name: gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          nx-cache: gate
      - name: Set up .NET (branches that have dotnet/)
        if: hashFiles('dotnet/**/*.slnx') != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: dotnet-ef, which the migration tests run (the EF Core version dotnet/ pins)
        if: hashFiles('dotnet/**/*.slnx') != ''
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Build, typecheck, lint and test
        # The desktop shell is the `desktop` job's: on Linux it needs WebKitGTK headers.
        run: pnpm exec nx run-many -t build typecheck lint test --exclude shell --output-style=static
      - name: Save the Nx task cache
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ runner.arch }}-gate-${{ github.sha }}

  integration:
    name: integration (Linux, Docker)
    # The .NET tests that need containers: the generated API against PostgreSQL, the Aspire
    # AppHost, Compose publishing (LLD-10 section 6). Not in `pnpm check`, which needs no Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: dotnet-ef, which the migration tests run (the EF Core version dotnet/ pins)
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Aspire CLI, with its orchestrator and dashboard bundle (the version dotnet/ pins)
        run: |
          curl -fsSL https://aspire.dev/install.sh -o "$RUNNER_TEMP/aspire-install.sh"
          bash "$RUNNER_TEMP/aspire-install.sh" --version 13.6.5 --skip-path < /dev/null
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version
      - name: Container tests
        run: pnpm exec nx run dotnet:integration --output-style=static

  e2e:
    name: e2e (Linux, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          nx-cache: e2e
      - name: Set up .NET (the backend dialog's test runs this checkout's trivia-dotnet)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
      - name: Save Playwright's browsers
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Save the Nx task cache
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ runner.arch }}-e2e-${{ github.sha }}

  desktop:
    name: desktop shell (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust-workspaces: crates/trivia_shell -> target
          nx-cache: desktop
      - name: Lint and test the shell
        run: pnpm exec nx run-many -t lint test -p shell --output-style=static
      - name: Save the Nx task cache
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ runner.arch }}-desktop-${{ github.sha }}

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  ci-ok:
    name: ci-ok
    if: always()
    needs: [gate, integration, e2e, desktop, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
