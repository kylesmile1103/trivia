# Everything, uncached, on every operating system (docs/ci.md). Never blocks a pull request.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    # A change to this workflow or the shared setup runs it, so it is tested before merge.
    paths: ['.github/workflows/nightly.yml', '.github/actions/**']

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  FORCE_COLOR: '1'

jobs:
  full:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKitGTK for the desktop shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ./.github/actions/setup
        with:
          rust-workspaces: |
            . -> target
            crates/trivia_shell -> target
      - name: Set up .NET (Linux, where Docker runs its database tests)
        if: runner.os == 'Linux' && hashFiles('dotnet/**/*.slnx') != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: dotnet-ef, which the migration tests run (the EF Core version dotnet/ pins)
        if: runner.os == 'Linux' && hashFiles('dotnet/**/*.slnx') != ''
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Build, typecheck, lint and test, uncached
        shell: bash
        run: |
          extra=()
          # The .NET tests start PostgreSQL in Docker, which only the Linux runners have.
          if [ -d dotnet ] && [ "$RUNNER_OS" != Linux ]; then extra+=(--exclude dotnet); fi
          pnpm exec nx run-many -t build typecheck lint test --skip-nx-cache --output-style=static "${extra[@]}"

  e2e:
    name: e2e (Linux, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Set up .NET (the backend dialog's test runs this checkout's trivia-dotnet)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-test-results
          path: test-results/
          retention-days: 7
