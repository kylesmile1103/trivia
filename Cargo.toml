[workspace]
resolver = "3"
members = ["crates/trivia_oxc_engine", "crates/trivia_napi"]
# The desktop shell is its own workspace: it needs a system webview to build (its README).
exclude = ["crates/trivia_shell"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
# OXC moves fast: keep every oxc crate on one exact version.
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"
oxc_syntax = "=0.153.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
