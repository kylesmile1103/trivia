# OpenAPI 3.0 fixture for @trivia/contract-sync.
# Exercises: operations WITHOUT operationId (hey-api derives names from method + path),
# x-trivia-resource overriding tags, $ref'd parameters / requestBodies / responses,
# `nullable: true`, a bare-array list (limit/offset), a cursor list under `data`,
# recursive schemas (LineItem.components, Warehouse.parent) and an untagged path.
openapi: 3.0.3
info:
  title: Orders API
  version: 2.0.0
servers:
  - url: https://orders.example.test/v2
paths:
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      summary: Place an order
      requestBody:
        $ref: '#/components/requestBodies/OrderInput'
      responses:
        '201':
          $ref: '#/components/responses/OrderResponse'
  /orders/{orderNumber}:
    parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
          pattern: '^ORD-[0-9]+$'
    get:
      tags: [Orders]
      summary: Get an order
      responses:
        '200':
          $ref: '#/components/responses/OrderResponse'
        '404':
          description: Not found
    patch:
      tags: [Orders]
      summary: Amend an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPatch'
      responses:
        '200':
          $ref: '#/components/responses/OrderResponse'
    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      responses:
        '204':
          description: Cancelled
  /orders/{orderNumber}/ship:
    post:
      tags: [Orders]
      summary: Hand the order to the carrier
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted
  /inventory/items:
    get:
      tags: [Stock]
      x-trivia-resource: InventoryItem
      operationId: listStock
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A cursor page of stock items
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockItem'
                  nextCursor:
                    type: string
                    nullable: true
  /inventory/items/{sku}:
    parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Stock]
      x-trivia-resource: InventoryItem
      summary: Get a stock item
      responses:
        '200':
          description: The stock item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
    put:
      tags: [Stock]
      x-trivia-resource: InventoryItem
      operationId: replaceStockItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockItem'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
  /reports/daily:
    get:
      summary: Daily totals
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Totals for one day
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  orderCount:
                    type: integer
                  revenue:
                    type: number
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  requestBodies:
    OrderInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderInput'
  responses:
    OrderResponse:
      description: An order
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
  schemas:
    OrderStatus:
      type: string
      enum: [draft, placed, shipped, cancelled]
    Order:
      type: object
      required: [orderNumber, status, lineItems, placedAt]
      properties:
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerEmail:
          type: string
          format: email
          nullable: true
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        total:
          type: number
        placedAt:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
    LineItem:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: number
        components:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
    OrderInput:
      type: object
      required: [lineItems]
      properties:
        customerEmail:
          type: string
          format: email
          nullable: true
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        notes:
          type: string
    OrderPatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        notes:
          type: string
          nullable: true
    StockItem:
      type: object
      required: [sku, name, onHand]
      properties:
        sku:
          type: string
        name:
          type: string
        onHand:
          type: integer
        warehouse:
          $ref: '#/components/schemas/Warehouse'
    Warehouse:
      type: object
      required: [code]
      properties:
        code:
          type: string
        parent:
          $ref: '#/components/schemas/Warehouse'
